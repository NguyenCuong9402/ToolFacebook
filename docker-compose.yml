  #     - codebase-network

  # redisinsight:
  #   image: redis/redisinsight:latest
  #   container_name: redisinsight
  #   ports:
  #     - "5540:5540"
  #   restart: always
  #   depends_on:
  #     - redis
  #   volumes:
  #     - redisinsight_data:/data
  #   networks:
  #     - codebase-network

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: codebase_app
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    env_file:
      - .env
    networks:
      - codebase-network
    restart: always

volumes:
  postgres_data:
  # redis_data:
  # redisinsight_data:

networks:
  codebase-network:
    driver: bridge