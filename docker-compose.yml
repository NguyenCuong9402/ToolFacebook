services:
  postgres:
    image: postgres:17
    container_name: postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - codebase-network

  # redis:
  #   image: redis:8
  #   container_name: redis
  #   ports:
  #     - "6379:6379"
  #   command: redis-server --requirepass ${REDIS_PASSWD} --save 60 1000
  #   restart: always
  #   volumes:
  #     - redis_data:/data
