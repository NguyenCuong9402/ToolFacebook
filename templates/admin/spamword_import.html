{% extends "admin/base_site.html" %}
{% load i18n %}

{% block content %}
<div id="content-main">
  <form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    <fieldset class="module aligned">
      <h2>Import từ khóa spam từ file .txt</h2>
      <div class="form-row">
        {{ form.import_file.errors }}
        {{ form.import_file.label_tag }}
        {{ form.import_file }}
      </div>
    </fieldset>
    <div class="submit-row">
      <input type="submit" value="Import" class="default" />
      <a href="{% url 'admin:app_spamword_changelist' %}" class="button cancel-link">Quay lại</a>
    </div>
  </form>
</div>
{% endblock %}
